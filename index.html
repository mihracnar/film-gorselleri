<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Görsel Seçim — Film Haritası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23f03010'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Teko:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --red:#f03010;--black:#0f0f0f;--white:#ffffff;--bg:#f2f1ef;
  --border:#e0dedd;--muted:#9a9896;--surface:#fff;--card-border:#e6e4e2;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--black);font-size:11px;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;}
button,input{font-family:inherit;cursor:pointer}
img{display:block}
#header{position:fixed;top:0;left:0;right:0;z-index:90;background:var(--surface);border-bottom:1px solid var(--border);}
#topbar{display:flex;align-items:center;padding:0 12px;min-height:48px;gap:8px;flex-wrap:wrap;}
.tb-brand{font-family:'Teko',sans-serif;font-size:16px;font-weight:500;letter-spacing:.5px;color:var(--black);flex-shrink:0;line-height:1;}
.tb-brand em{color:var(--red);font-style:normal}
.tb-divider{width:1px;height:16px;background:var(--border);flex-shrink:0}
.tb-stats{display:flex;gap:8px;min-width:0;overflow:hidden}
@media(max-width:400px){.tb-stats{display:none}}
.tb-stat{font-size:10px;color:var(--muted);white-space:nowrap}
.tb-stat strong{color:var(--black);font-weight:400}
.tb-stat.accent strong{color:var(--red)}
.tb-gap{flex:1}
.tb-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border:1px solid var(--border);background:var(--surface);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;transition:all .12s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.btn:hover:not(:disabled){background:var(--bg)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{color:#bbb;cursor:default}
.btn-primary{background:var(--black);color:#fff;border-color:var(--black)}
.btn-primary:hover:not(:disabled){background:#222;border-color:#222}
.btn-primary:disabled{background:#bbb;border-color:#bbb}
.btn-badge{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;min-width:18px;text-align:center;border-radius:2px;letter-spacing:0;font-family:'DM Mono',monospace;}
#filterbar{display:flex;align-items:center;gap:8px;padding:0 16px;height:40px;border-top:1px solid var(--border);}
.f-tabs{display:flex;gap:2px}
.f-tab{height:28px;padding:0 12px;border:1px solid transparent;background:transparent;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .1s;}
.f-tab.on{background:var(--black);color:#fff;border-color:var(--black);}
.f-tab:hover:not(.on){color:var(--black)}
.f-search{flex:1;min-width:0;height:28px;border:1px solid var(--border);background:var(--bg);padding:0 10px;font-size:11px;color:var(--black);}
.f-search::placeholder{color:var(--muted)}
.f-search:focus{outline:none;border-color:#aaa;background:#fff}
.f-count{font-size:10px;color:var(--muted);white-space:nowrap;flex-shrink:0}
#content{padding:20px 16px;padding-top:110px;max-width:1600px;margin:0 auto}
.film-section{margin-bottom:36px}
.film-hdr{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid var(--black);}
.film-hdr-left{flex:1;min-width:0}
.film-name{font-family:'Teko',sans-serif;font-size:22px;font-weight:500;line-height:1.1;letter-spacing:.3px;margin-bottom:6px;}
.film-pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:var(--bg);border:1px solid var(--border);padding:2px 8px;white-space:nowrap;}
.pill b{color:#555;font-weight:400;letter-spacing:0;font-size:9px;text-transform:none}
.film-hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:4px;}
.film-selcount{font-size:10px;color:var(--muted);white-space:nowrap}
.film-selcount strong{color:var(--black);font-weight:400}
.img-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;}
@media(min-width:480px){.img-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.img-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
@media(min-width:1100px){.img-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.img-card{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--card-border);outline:2px solid transparent;outline-offset:-2px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:outline-color .12s;}
.img-card.selected{outline-color:var(--red)}
.img-card img{width:100%;height:100%;object-fit:cover;transition:opacity .2s;}
.no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--muted);letter-spacing:1px;background:#e8e6e4;}
.tick{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.tick svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.img-card.selected .tick{opacity:1}
.card-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .12s;pointer-events:none;}
.img-card:hover .card-overlay{background:rgba(0,0,0,.08)}
.img-id{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.5);color:#fff;font-size:7px;padding:2px 5px;letter-spacing:.3px;pointer-events:none;}
.sil-btn{position:absolute;top:5px;right:30px;height:18px;padding:0 7px;background:rgba(0,0,0,.6);color:#fff;font-size:7px;letter-spacing:.8px;text-transform:uppercase;border:none;cursor:pointer;opacity:1;}
.sil-btn:hover{background:rgba(200,20,5,.85)}
.mekan-badge{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;background:rgba(15,15,15,.6);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);color:#fff;display:flex;align-items:center;gap:4px;cursor:pointer;transition:background .12s;}
.mekan-badge:hover{background:rgba(15,15,15,.78)}
.mekan-name{flex:1;font-size:8px;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mekan-name.placeholder{color:rgba(255,255,255,.5);font-style:italic}
.mekan-arr{flex-shrink:0;font-size:8px;opacity:.5;}
@media(hover:none){.mekan-badge{opacity:1}}
.zoom-btn{position:absolute;top:4px;left:30px;width:18px;height:18px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .12s;}
.zoom-btn:hover{background:rgba(0,0,0,.75)}
.img-card:hover .zoom-btn{opacity:1}
.zoom-btn{opacity:1}
#emptyState{display:flex;flex-direction:column;align-items:center;padding:80px 20px;color:var(--muted);}
.empty-icon{font-family:'Teko',sans-serif;font-size:64px;font-weight:400;color:var(--border);line-height:1;margin-bottom:16px;}
.empty-t{font-size:10px;letter-spacing:2px;text-transform:uppercase}
.empty-s{font-size:10px;margin-top:8px;color:var(--border)}
#mekanModal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);pointer-events:none;transition:background .2s;}
#mekanModal.open{background:rgba(0,0,0,.5);pointer-events:auto;}
.modal-box{width:100%;max-width:520px;max-height:75vh;display:flex;flex-direction:column;background:var(--surface);border-top:3px solid var(--black);transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
#mekanModal.open .modal-box{transform:translateY(0)}
@media(min-width:640px){
  #mekanModal{align-items:center}
  .modal-box{max-height:70vh;border:1px solid var(--border);border-top:3px solid var(--black);transform:translateY(8px);opacity:0;transition:transform .2s,opacity .2s;}
  #mekanModal.open .modal-box{transform:translateY(0);opacity:1}
}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-hdr-left{display:flex;align-items:baseline;gap:8px}
.modal-title{font-family:'Teko',sans-serif;font-size:16px;font-weight:500;letter-spacing:.3px;}
.modal-selcount{font-size:9px;color:var(--red);letter-spacing:1px}
.modal-actions{display:flex;gap:5px}
.modal-search{display:block;width:100%;border:none;border-bottom:1px solid var(--border);padding:10px 16px;font-size:12px;font-family:'DM Mono',monospace;background:#fafaf9;color:var(--black);flex-shrink:0;}
.modal-search::placeholder{color:var(--muted)}
.modal-search:focus{outline:none;background:#fff}
.modal-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;border:none;border-bottom:1px solid #f5f4f2;background:#fff;font-size:11px;font-family:'DM Mono',monospace;text-align:left;cursor:pointer;transition:background .08s;-webkit-tap-highlight-color:transparent;min-height:44px;}
.modal-item:hover{background:#faf9f7}
.modal-item:active{background:#f0efed}
.modal-item.on{background:#fff8f7}
.modal-chk{width:14px;height:14px;border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .1s;}
.modal-item.on .modal-chk{background:var(--red);border-color:var(--red)}
.modal-chk-svg{width:8px;height:8px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;opacity:0;transition:opacity .1s}
.modal-item.on .modal-chk-svg{opacity:1}
.modal-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-item.clear-btn{color:var(--muted);font-size:10px;letter-spacing:.5px;border-bottom:2px solid var(--border)}
.modal-item.clear-btn:hover{background:#faf9f7;color:var(--black)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:8px 18px;font-size:10px;letter-spacing:.8px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:400;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
#loading{position:fixed;inset:0;background:rgba(242,241,239,.85);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#loading.show{display:flex}
.loading-bar{width:120px;height:2px;background:var(--border);overflow:hidden;}
.loading-bar-inner{height:100%;width:40%;background:var(--red);animation:slide 1.2s ease-in-out infinite;}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.loading-txt{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
#lightbox{position:fixed;inset:0;z-index:500;background:rgba(10,10,10,.96);display:none;align-items:center;justify-content:center;flex-direction:column;}
#lightbox.open{display:flex}
#lb-img{max-width:calc(100vw - 80px);max-height:calc(100vh - 120px);object-fit:contain;display:block;user-select:none;}
#lb-meta{margin-top:12px;font-size:10px;color:rgba(255,255,255,.4);letter-spacing:1px;text-align:center;}
#lb-close{position:fixed;top:16px;right:16px;width:36px;height:36px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;-webkit-tap-highlight-color:transparent;}
#lb-close:hover{background:rgba(255,255,255,.2)}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:64px;background:rgba(255,255,255,.07);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;-webkit-tap-highlight-color:transparent;}
.lb-nav:hover{background:rgba(255,255,255,.15)}
#lb-prev{left:0}
#lb-next{right:0}
@media(max-width:480px){#lb-img{max-width:100vw;max-height:calc(100vh - 80px)}.lb-nav{width:36px}}
</style>
</head>
<body>

<div id="header">
  <div id="topbar">
    <a href="https://sinemaofisitest.ibb.istanbul/" target="_blank" style="display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0">
      <svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <circle cx="16" cy="16" r="12" fill="#f03010"/>
      </svg>
      <div class="tb-brand"><em>×</em> Görsel Seçme Uygulaması</div>
    </a>
    <div class="tb-divider"></div>
    <div class="tb-stats">
      <span class="tb-stat"       id="stTotal"><strong>—</strong> görsel</span>
      <span class="tb-stat accent" id="stSel"  ><strong>—</strong> seçili</span>
      <span class="tb-stat"        id="stPend" ><strong>—</strong> bekliyor</span>
    </div>
    <div class="tb-gap"></div>
    <div class="tb-actions">
      <button class="btn" id="discardBtn" onclick="discardChanges()" disabled>Vazgeç</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveAll()" disabled>
        Kaydet<span class="btn-badge" id="badge" style="display:none">0</span>
      </button>
    </div>
  </div>
  <div id="filterbar">
    <div class="f-tabs">
      <button class="f-tab on" onclick="setF('all',this)">Tümü</button>
      <button class="f-tab"    onclick="setF('sel',this)">Seçili</button>
      <button class="f-tab"    onclick="setF('pend',this)">Bekliyor</button>
    </div>
    <input class="f-search" id="srch" placeholder="Film veya yönetmen…" oninput="setSrch(this.value)">
    <span class="f-count" id="fCount">— film</span>
  </div>
</div>

<div id="content">
  <div id="emptyState">
    <div class="empty-icon">◫</div>
    <div class="empty-t">Yükleniyor</div>
    <div class="empty-s">Görseller hazırlanıyor…</div>
  </div>
  <div id="filmList" style="display:none"></div>
</div>

<div id="mekanModal" onclick="modalBgClick(event)">
  <div class="modal-box">
    <div class="modal-hdr">
      <div class="modal-hdr-left">
        <span class="modal-title">Mekan Seç</span>
        <span class="modal-selcount" id="modalCount"></span>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="applyMekan()">✓ Uygula</button>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>
    </div>
    <input class="modal-search" id="modalSrch" placeholder="Mekan ara…" oninput="filterModal(this.value)">
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<div id="lightbox" onclick="lbBg(event)">
  <button id="lb-close" onclick="lbClose()">✕</button>
  <button class="lb-nav" id="lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lb-img" src="" alt="" referrerpolicy="no-referrer">
  <div id="lb-meta"></div>
  <button class="lb-nav" id="lb-next" onclick="lbNav(1)">›</button>
</div>

<div id="toast"></div>
<div id="loading">
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  <div class="loading-txt">Yükleniyor</div>
</div>

<script>
var SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbwwQrziiNQ1z48BVrdLHxdKdrD0XD18wbwnaCbpK0kOBg2GON6-S7larCMrPwDG4vFKQw/exec';
var GORSEL_GID  = '1877749729';
var SHEETS_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTXt4zT3CyoU90VGbFB8zUjGaqErL2l-CVSXoHE0JExFEDtCMoeEkZOsoR1ir3vLONtrspJAwG1kZSA/pub?output=csv';
var GID_FILMLER  = '0';
var GID_MEKANLAR = '314226555';

var items=[], filmInfo={}, mekanlar=[], sel={}, orig={};
var activeF='all', srch='', modalGorselId=null, modalSelected=[];
var lbItems=[], lbCur=0;

function parseCsv(txt) {
  var rows=[],lines=txt.split('\n');
  for(var li=0;li<lines.length;li++){
    var line=lines[li].trim();if(!line)continue;
    var cols=[],cur='',inQ=false;
    for(var i=0;i<line.length;i++){
      var c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){cols.push(cur.trim());cur='';}
      else cur+=c;
    }
    cols.push(cur.trim());rows.push(cols);
  }
  return rows;
}

async function init() {
  showLoad(true);
  try {
    var [fRes,gRes,mRes]=await Promise.all([
      fetch(SHEETS_BASE+'&gid='+GID_FILMLER),
      fetch(SHEETS_BASE+'&gid='+GORSEL_GID),
      fetch(SHEETS_BASE+'&gid='+GID_MEKANLAR)
    ]);
    var [fTxt,gTxt,mTxt]=await Promise.all([fRes.text(),gRes.text(),mRes.text()]);

    filmInfo={};
    parseCsv(fTxt).slice(1).forEach(function(r){
      var ad=(r[1]||'').trim();
      if(ad) filmInfo[ad]={yonetmen:(r[3]||'').trim(),tur:((r[4]||'').split(',')[0]).trim(),yil:(r[5]||'').trim()};
    });

    mekanlar=parseCsv(mTxt).slice(1)
      .map(function(r){return(r[1]||'').trim();})
      .filter(Boolean)
      .sort(function(a,b){return a.localeCompare(b,'tr');});

    sel={};orig={};
    items=parseCsv(gTxt).slice(1)
      .filter(function(r){return r[0]&&r[3];})
      .map(function(r){
        var st=String(r[4]||'').trim();
        return{id:r[0].trim(),filmAdi:(r[1]||'').trim(),mekan:(r[2]||'').trim(),url:r[3].trim(),secimDurumu:st};
      });
    items.forEach(function(it){
      sel[it.id]={secimDurumu:it.secimDurumu,mekan:it.mekan};
      orig[it.id]={secimDurumu:it.secimDurumu,mekan:it.mekan};
    });

    render();
    toast(items.length+' görsel yüklendi');
  } catch(e){toast('Yükleme hatası: '+e.message,true);}
  showLoad(false);
}

function visItems(f){
  f=f||activeF;
  return items.filter(function(it){
    var st=sel[it.id].secimDurumu;
    if(st==='x') return false;
    if(f==='sel') return st==='1';
    if(f==='pend') return st!=='1';
    return true;
  });
}

function visFilms(){
  var all=visItems(),films=[],seen={},q=srch.toLowerCase();
  all.forEach(function(it){
    if(q){
      var inf=filmInfo[it.filmAdi]||{};
      if(!it.filmAdi.toLowerCase().includes(q)&&!(inf.yonetmen||'').toLowerCase().includes(q)) return;
    }
    if(!seen[it.filmAdi]){seen[it.filmAdi]=true;films.push(it.filmAdi);}
  });
  return films;
}

function mekanLabel(mk){
  if(!mk) return null;
  var p=mk.split(',').map(function(s){return s.trim();}).filter(Boolean);
  if(!p.length) return null;
  return p.length===1?p[0]:p[0]+' +'+(p.length-1);
}

function render(){
  var films=visFilms();
  var list=document.getElementById('filmList');
  var empty=document.getElementById('emptyState');
  if(!items.length){list.style.display='none';empty.style.display='flex';return;}
  empty.style.display='none';list.style.display='';

  list.innerHTML=films.map(function(filmAdi){
    var inf=filmInfo[filmAdi]||{};
    var fVis=visItems().filter(function(it){return it.filmAdi===filmAdi;});
    var selN=fVis.filter(function(it){return sel[it.id].secimDurumu==='1';}).length;
    var allS=fVis.length>0&&selN===fVis.length;

    var pills='';
    if(inf.yil)      pills+='<span class="pill">Yıl <b>'+inf.yil+'</b></span>';
    if(inf.yonetmen) pills+='<span class="pill">Yönetmen <b>'+inf.yonetmen+'</b></span>';
    if(inf.tur)      pills+='<span class="pill">Tür <b>'+inf.tur+'</b></span>';
    pills+='<span class="pill">Görsel <b>'+fVis.length+'</b></span>';

    var secId='S'+filmAdi.replace(/[^a-zA-Z0-9]/g,'_');

    var cards=fVis.map(function(it){
      var on=sel[it.id].secimDurumu==='1';
      var mk=sel[it.id].mekan||'';
      var lbl=mekanLabel(mk);

      var card=document.createElement('div');
      card.className='img-card'+(on?' selected':'');
      card.setAttribute('role','checkbox');
      card.setAttribute('aria-checked',on?'true':'false');
      card.dataset.id=it.id;
      card.dataset.film=filmAdi;

      var img=document.createElement('img');
      img.src=it.url;img.loading='lazy';img.alt='';
      img.referrerPolicy='no-referrer';
      var noImg=document.createElement('div');
      noImg.className='no-img';noImg.style.display='none';noImg.textContent='—';
      img.onerror=function(){img.style.display='none';noImg.style.display='flex';};

      var overlay=document.createElement('div');overlay.className='card-overlay';
      var tick=document.createElement('div');tick.className='tick';
      tick.innerHTML='<svg viewBox="0 0 9 8"><polyline points="1,4 3.5,7 8,1"/></svg>';
      var idBadge=document.createElement('div');idBadge.className='img-id';idBadge.textContent=it.id;

      var silBtn=document.createElement('button');silBtn.className='sil-btn';silBtn.textContent='Sil';silBtn.dataset.action='sil';
      var zoomBtn=document.createElement('button');zoomBtn.className='zoom-btn';zoomBtn.textContent='⤢';zoomBtn.dataset.action='zoom';zoomBtn.setAttribute('aria-label','Tam ekran');

      var mekanBadge=document.createElement('div');mekanBadge.className='mekan-badge';mekanBadge.dataset.action='mekan';mekanBadge.setAttribute('role','button');mekanBadge.setAttribute('aria-label','Mekan seç');
      var mekanName=document.createElement('span');mekanName.className='mekan-name'+(lbl?'':' placeholder');mekanName.textContent=lbl||'Mekan seç';
      var mekanArr=document.createElement('span');mekanArr.className='mekan-arr';mekanArr.textContent='▾';
      mekanBadge.appendChild(mekanName);mekanBadge.appendChild(mekanArr);

      card.appendChild(img);card.appendChild(noImg);card.appendChild(overlay);card.appendChild(tick);
      card.appendChild(idBadge);card.appendChild(silBtn);card.appendChild(zoomBtn);card.appendChild(mekanBadge);
      return card.outerHTML;
    }).join('');

    return '<div class="film-section" id="'+secId+'">'+
      '<div class="film-hdr">'+
        '<div class="film-hdr-left"><div class="film-name">'+filmAdi+'</div><div class="film-pills">'+pills+'</div></div>'+
        '<div class="film-hdr-right">'+
          '<span class="film-selcount" id="fc_'+secId+'"><strong>'+selN+'</strong>&thinsp;/&thinsp;'+fVis.length+' seçili</span>'+
          '<button class="btn film-tog-btn" data-film="'+filmAdi.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" data-val="'+((!allS)?'1':'')+'" style="height:28px;font-size:9px">'+(allS?'Kaldır':'Tümünü Seç')+'</button>'+
        '</div>'+
      '</div>'+
      '<div class="img-grid">'+cards+'</div>'+
    '</div>';
  }).join('');

  updateStats();
}

function updateStats(){
  var all=visItems('all');
  var selN=all.filter(function(it){return sel[it.id].secimDurumu==='1';}).length;
  var pend=all.filter(function(it){return sel[it.id].secimDurumu!=='1';}).length;
  var chg=changed();
  document.getElementById('stTotal').innerHTML='<strong>'+all.length+'</strong> görsel';
  document.getElementById('stSel'  ).innerHTML='<strong>'+selN+'</strong> seçili';
  document.getElementById('stPend' ).innerHTML='<strong>'+pend+'</strong> bekliyor';
  document.getElementById('fCount' ).textContent=visFilms().length+' film';
  var badge=document.getElementById('badge');
  badge.textContent=chg;badge.style.display=chg?'':'none';
  document.getElementById('saveBtn').disabled=chg===0;
  document.getElementById('discardBtn').disabled=chg===0;
}

function changed(){
  return Object.keys(sel).filter(function(id){
    return sel[id].secimDurumu!==orig[id].secimDurumu||sel[id].mekan!==orig[id].mekan;
  }).length;
}

function tog(id){
  sel[id].secimDurumu=sel[id].secimDurumu==='1'?'':'1';
  var card=cardEl(id);
  if(card){card.classList.toggle('selected',sel[id].secimDurumu==='1');card.setAttribute('aria-checked',sel[id].secimDurumu==='1'?'true':'false');}
  refreshHdr(filmOf(id));updateStats();
}

function sil(e,id){
  e.stopPropagation();
  sel[id].secimDurumu='x';
  var card=cardEl(id);
  if(card){card.style.transition='opacity .18s';card.style.opacity='0';card.style.pointerEvents='none';setTimeout(function(){card.remove();},200);}
  var film=filmOf(id);
  setTimeout(function(){
    refreshHdr(film);
    if(!visItems().filter(function(it){return it.filmAdi===film;}).length){
      var sec=document.getElementById('S'+film.replace(/[^a-zA-Z0-9]/g,'_'));
      if(sec){sec.style.transition='opacity .18s';sec.style.opacity='0';setTimeout(function(){sec.remove();},200);}
    }
  },210);
  updateStats();
}

function togFilm(filmAdi,newVal){
  visItems().filter(function(it){return it.filmAdi===filmAdi;}).forEach(function(it){
    sel[it.id].secimDurumu=newVal?'1':'';
    var card=cardEl(it.id);
    if(card){card.classList.toggle('selected',newVal);card.setAttribute('aria-checked',newVal?'true':'false');}
  });
  refreshHdr(filmAdi);updateStats();
}

function discardChanges(){
  if(!changed()) return;
  if(!confirm('Kaydedilmemiş değişiklikler geri alınacak. Devam edilsin mi?')) return;
  Object.keys(sel).forEach(function(id){sel[id].secimDurumu=orig[id].secimDurumu;sel[id].mekan=orig[id].mekan;});
  render();toast('Değişiklikler geri alındı');
}

function mekanModalEl(){return document.getElementById('mekanModal');}

function openModal(e,id){
  e.stopPropagation();
  modalGorselId=id;
  var cur=(sel[id]&&sel[id].mekan)||'';
  modalSelected=cur?cur.split(',').map(function(s){return s.trim();}).filter(Boolean):[];
  document.getElementById('modalSrch').value='';
  buildModalList('');
  mekanModalEl().classList.add('open');
  setTimeout(function(){document.getElementById('modalSrch').focus();},250);
}

function closeModal(){mekanModalEl().classList.remove('open');modalGorselId=null;modalSelected=[];}

function applyMekan(){
  if(!modalGorselId) return;
  var joined=modalSelected.join(', ');
  sel[modalGorselId].mekan=joined;
  var card=cardEl(modalGorselId);
  if(card){
    var nm=card.querySelector('.mekan-name');
    var lbl=mekanLabel(joined);
    if(nm){nm.textContent=lbl||'Mekan seç';nm.className='mekan-name'+(lbl?'':' placeholder');}
  }
  updateStats();closeModal();
}

function modalBgClick(e){if(e.target===mekanModalEl()) applyMekan();}
function filterModal(q){buildModalList(q);}

function buildModalList(q){
  var cnt=document.getElementById('modalCount');
  var list=document.getElementById('modalList');
  var filt=mekanlar.filter(function(m){return!q||m.toLowerCase().includes(q.toLowerCase());});
  if(cnt) cnt.textContent=modalSelected.length?modalSelected.length+' seçili':'';
  var chkSvg='<svg class="modal-chk-svg" viewBox="0 0 9 8"><polyline points="1,4 3.5,7 8,1"/></svg>';
  var html='<button class="modal-item clear-btn" onclick="clearMekanAll()"><div class="modal-chk"></div><span class="modal-item-name">Seçimi temizle</span></button>';
  html+=filt.map(function(m){
    var on=modalSelected.indexOf(m)>=0;
    return '<button class="modal-item'+(on?' on':'')+'" onclick="toggleMekanItem(\''+esc(m)+'\')">'+'<div class="modal-chk">'+chkSvg+'</div><span class="modal-item-name">'+m+'</span></button>';
  }).join('');
  list.innerHTML=html;
}

function toggleMekanItem(m){
  var idx=modalSelected.indexOf(m);
  if(idx>=0) modalSelected.splice(idx,1); else modalSelected.push(m);
  buildModalList(document.getElementById('modalSrch').value);
}

function clearMekanAll(){modalSelected=[];buildModalList(document.getElementById('modalSrch').value);}

async function saveAll(){
  var updates=Object.keys(sel)
    .filter(function(id){return sel[id].secimDurumu!==orig[id].secimDurumu||sel[id].mekan!==orig[id].mekan;})
    .map(function(id){return{id:id,secimDurumu:sel[id].secimDurumu,mekan:sel[id].mekan};});
  if(!updates.length){toast('Değişiklik yok');return;}
  showLoad(true);
  document.getElementById('saveBtn').disabled=true;
  document.getElementById('discardBtn').disabled=true;
  var ok=false;
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({updates:updates})});
    ok=true;
  }catch(e){toast('Bağlantı hatası',true);}
  if(ok){
    updates.forEach(function(u){orig[u.id].secimDurumu=u.secimDurumu;orig[u.id].mekan=u.mekan;});
    updateStats();toast(updates.length+' kayıt güncellendi');
  }
  document.getElementById('saveBtn').disabled=!changed();
  document.getElementById('discardBtn').disabled=!changed();
  showLoad(false);
}

function setF(f,btn){activeF=f;document.querySelectorAll('.f-tab').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');render();}
function setSrch(v){srch=v;render();}
function filmOf(id){var it=items.find(function(i){return i.id===id;});return it?it.filmAdi:'';}
function cardEl(id){return document.querySelector('.img-card[data-id="'+id+'"]');}
function refreshHdr(filmAdi){
  if(!filmAdi) return;
  var secId='S'+filmAdi.replace(/[^a-zA-Z0-9]/g,'_');
  var sec=document.getElementById(secId);if(!sec) return;
  var fVis=visItems().filter(function(it){return it.filmAdi===filmAdi;});
  var selN=fVis.filter(function(it){return sel[it.id].secimDurumu==='1';}).length;
  var allS=fVis.length>0&&selN===fVis.length;
  var fc=document.getElementById('fc_'+secId);
  var btn=sec.querySelector('.film-hdr-right .btn');
  if(fc) fc.innerHTML='<strong>'+selN+'</strong>&thinsp;/&thinsp;'+fVis.length+' seçili';
  if(btn){btn.textContent=allS?'Kaldır':'Tümünü Seç';btn.onclick=(function(fa,v){return function(){togFilm(fa,v);};})(filmAdi,!allS);}
}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function toast(msg,isErr){var t=document.getElementById('toast');t.textContent=msg;t.className='show'+(isErr?' err':'');clearTimeout(t._t);t._t=setTimeout(function(){t.className='';},3000);}
function showLoad(on){document.getElementById('loading').classList.toggle('show',on);}

function lbOpen(filmAdi,startId){
  var fVis=visItems().filter(function(it){return it.filmAdi===filmAdi;});
  lbItems=fVis;
  lbCur=fVis.findIndex(function(it){return it.id===startId;});
  if(lbCur<0) lbCur=0;
  lbShow();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function lbClose(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
function lbBg(e){if(e.target===document.getElementById('lightbox')) lbClose();}
function lbNav(dir){lbCur=(lbCur+dir+lbItems.length)%lbItems.length;lbShow();}
function lbShow(){
  var it=lbItems[lbCur];if(!it) return;
  var img=document.getElementById('lb-img');
  img.src=it.url;
  var mk=sel[it.id]&&sel[it.id].mekan?' · '+sel[it.id].mekan:'';
  document.getElementById('lb-meta').textContent=it.filmAdi+mk+'  '+it.id+'  '+(lbCur+1)+' / '+lbItems.length;
}

document.getElementById('content').addEventListener('click',function(e){
  var btn=e.target.closest('.film-tog-btn');
  if(!btn) return;
  togFilm(btn.dataset.film, btn.dataset.val==='1');
});

document.getElementById('filmList').addEventListener('click',function(e){
  var card=e.target.closest('.img-card');
  if(!card) return;
  var id=card.dataset.id, film=card.dataset.film;
  var action=e.target.closest('[data-action]');
  if(action){
    var act=action.dataset.action;
    if(act==='sil'){e.stopPropagation();sil(e,id);return;}
    if(act==='zoom'){e.stopPropagation();lbOpen(film,id);return;}
    if(act==='mekan'){e.stopPropagation();openModal(e,id);return;}
  }
  if(e.target.classList.contains('card-overlay')&&e.detail>=2){lbOpen(film,id);return;}
  if(!e.target.closest('button')&&!e.target.closest('.mekan-badge')) tog(id);
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(document.getElementById('lightbox').classList.contains('open')){lbClose();return;}
    if(mekanModalEl().classList.contains('open')){applyMekan();return;}
  }
  if(document.getElementById('lightbox').classList.contains('open')){
    if(e.key==='ArrowRight') lbNav(1);
    if(e.key==='ArrowLeft')  lbNav(-1);
  }
});

init();
</script>
</body>
</html>
